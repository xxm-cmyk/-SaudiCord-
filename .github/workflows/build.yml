name: SaudiCord Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ github.token }}
    EQUICORD_REMOTE: xxm-cmyk/-SaudiCord-

permissions:
    contents: write
    actions: write

jobs:
    Validate:
        name: Validate Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Lint & type-check
              run: pnpm test

    Build:
        name: Build SaudiCord
        needs: Validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true
            - name: Build web
              run: pnpm buildWebStandalone
            - name: Build
              run: pnpm buildStandalone
            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json
            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir -p release
                  cp browser/browser.* release 2>/dev/null || true
                  cp Equicord.user.{js,js.LEGAL.txt} release 2>/dev/null || true
                  cp *.{json,zip,asar} release 2>/dev/null || true
                  cp desktop/* release 2>/dev/null || true
                  for file in equibop/*; do
                    [ -e "$file" ] || continue
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done
                  find release -size 0 -delete
                  rm -f release/package.json release/*.map
            - name: Upload SaudiCord Stable
              if: ${{ github.repository == 'xxm-cmyk/-SaudiCord-' && vars.ACT != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  HASH=$(git rev-parse --short HEAD)
                  gh release create v1.0.0-stable --target main --title "SaudiCord $HASH" --notes "Official Release" 2>/dev/null || \
                  gh release edit v1.0.0-stable --title "SaudiCord $HASH" --notes "Official Release"
                  gh release upload v1.0.0-stable --clobber dist/release/*

    WindowsInstaller:
        name: Build Windows EXE Installer
        needs: Validate
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build standalone payload
              run: pnpm buildStandalone
            - name: Prepare installer payload
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force installer/payload | Out-Null
                  Copy-Item (Get-Command node).Source installer/payload/node.exe
                  Copy-Item installer/install.mjs installer/payload/install.mjs
                  Copy-Item scripts/saudicord/asar.mjs installer/payload/asar.mjs
                  Copy-Item dist/desktop.asar installer/payload/saudicord.asar
            - name: Install Inno Setup
              run: choco install innosetup --yes --no-progress
            - name: Compile EXE
              shell: pwsh
              run: |
                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  & $iscc installer/SaudiCord.iss
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Upload SaudiCord Setup
              if: ${{ github.repository == 'xxm-cmyk/-SaudiCord-' && vars.ACT != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: |
                  gh release create v1.0.0-stable --target main --title "SaudiCord ${{ github.sha }}" --notes "Official Release" 2>$null
                  if ($LASTEXITCODE -ne 0) {
                    gh release edit v1.0.0-stable --title "SaudiCord ${{ github.sha }}" --notes "Official Release"
                  }
                  gh release upload v1.0.0-stable --clobber installer/output/SaudiCord-Setup.exe
